<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OfflineNav Android GPS & Voz</title>

    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .leaflet-bottom {
            bottom: 85px !important;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between text-slate-100 bg-slate-900 select-none">

    <!-- Barra Superior -->
    <header class="absolute top-0 left-0 right-0 z-30 p-3 flex items-center justify-between bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-lg">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-md">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-tight text-white leading-tight">OfflineNav Android</h1>
                <div class="flex items-center space-x-1.5 text-xs text-emerald-400">
                    <span id="gpsStatusDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="gpsStatusText">Buscando GPS...</span>
                    <span class="text-slate-500">•</span>
                    <span id="speedDisplay">0 km/h</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <!-- Controles Flotantes Laterales -->
    <div class="absolute right-3 bottom-24 z-20 flex flex-col space-y-3">
        <button onclick="centerOnUser()" class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-xl text-white active:scale-95 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"></path></svg>
        </button>
    </div>

    <!-- Panel Desplegable -->
    <div id="actionPanel" class="absolute bottom-20 left-3 right-3 z-30 bg-slate-900/95 backdrop-blur-md border border-slate-700 p-4 rounded-2xl shadow-2xl hidden">
        <div class="flex justify-between items-center mb-2">
            <h3 id="panelTitle" class="text-sm font-bold text-white">Panel</h3>
            <button onclick="closePanel()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
        </div>
        <div id="panelContent" class="text-xs text-slate-300">
            <!-- Contenido dinámico -->
        </div>
    </div>

    <!-- Barra de Navegación Inferior -->
    <nav class="absolute bottom-2 left-3 right-3 z-30 bg-slate-900/95 backdrop-blur-md border border-slate-700/80 px-4 py-3 rounded-2xl flex justify-around items-center text-xs font-medium text-slate-400 shadow-2xl">
        <button onclick="setActiveTab('map')" class="flex flex-col items-center space-y-1 text-blue-500" id="tabMap">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
            <span>Mapa</span>
        </button>
        <button onclick="openRouteMenu()" class="flex flex-col items-center space-y-1 hover:text-slate-200" id="tabRoute">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-1.544-1.544M9 20l4.544-4.544M9 20V10m0 0l-4.544 4.544M9 10l4.544-4.544"></path></svg>
            <span>Ruta</span>
        </button>
        <button onclick="openVoiceMenu()" class="flex flex-col items-center space-y-1 hover:text-slate-200" id="tabVoice">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            <span>Voz</span>
        </button>
        <button onclick="openMenu()" class="flex flex-col items-center space-y-1 hover:text-slate-200" id="tabMenu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span>Menú</span>
        </button>
    </nav>

    <!-- Script Principal -->
    <script>
        let map, userMarker, destinationMarker;
        let isFollowing = true;
        let recognition;

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([19.4326, -99.1332], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap',
                subdomains: ['a', 'b', 'c']
            }).addTo(map);

            setTimeout(() => { map.invalidateSize(); }, 400);

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(0) : 0;

                        document.getElementById('speedDisplay').innerText = `${speed} km/h`;
                        document.getElementById('gpsStatusText').innerText = "GPS Activo";

                        const latLng = [lat, lng];
                        if (!userMarker) {
                            userMarker = L.marker(latLng).addTo(map);
                            map.setView(latLng, 16);
                        } else {
                            userMarker.setLatLng(latLng);
                        }

                        if (isFollowing) {
                            map.setView(latLng, map.getZoom());
                        }
                    },
                    (error) => {
                        document.getElementById('gpsStatusText').innerText = "Sin señal GPS";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }

            initSpeechRecognition();
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onresult = function(event) {
                    const speechResult = event.results[0][0].transcript.toLowerCase();
                    document.getElementById('voiceStatus').innerText = `Dijiste: "${speechResult}"`;
                    speak(`Buscando destino: ${speechResult}`);
                    processVoiceCommand(speechResult);
                };

                recognition.onerror = function(event) {
                    document.getElementById('voiceStatus').innerText = "No se entendió. Intenta de nuevo.";
                };
            }
        }

        function startListening() {
            if (recognition) {
                try {
                    recognition.start();
                    document.getElementById('voiceStatus').innerText = "Escuchando... Habla ahora.";
                    speak("Te escucho");
                } catch(e) {
                    console.log(e);
                }
            } else {
                alert("Tu navegador no soporta reconocimiento de voz directo.");
            }
        }

        function processVoiceCommand(command) {
            if (command.includes('casa')) {
                speak("Navegando hacia casa.");
                // Simulación de coordenadas de destino (puedes personalizarlas)
                setDestination(19.4350, -99.1410, "Casa");
            } else {
                // Búsqueda simulada o directa de un lugar usando Nominatim de OpenStreetMap
                searchLocation(command);
            }
        }

        async function searchLocation(query) {
            document.getElementById('voiceStatus').innerText = `Buscando "${query}" en el mapa...`;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    setDestination(lat, lon, data[0].display_name);
                    speak("Destino encontrado. Iniciando ruta.");
                } else {
                    speak("No encontré el lugar especificado.");
                    document.getElementById('voiceStatus').innerText = "No se encontró el lugar.";
                }
            } catch (err) {
                speak("Error de conexión al buscar el destino.");
            }
        }

        function setDestination(lat, lon, name) {
            const destLatLng = [lat, lon];
            if (destinationMarker) {
                destinationMarker.setLatLng(destLatLng);
            } else {
                destinationMarker = L.marker(destLatLng, {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.9/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41]
                    })
                }).addTo(map);
            }
            map.setView(destLatLng, 15);
            isFollowing = false;
            document.getElementById('actionPanel').classList.add('hidden');
        }

        function centerOnUser() {
            isFollowing = true;
            if (userMarker) {
                map.setView(userMarker.getLatLng(), 17);
                speak("Centrado en tu ubicación");
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                window.speechSynthesis.speak(utterance);
            }
        }

        function openRouteMenu() {
            setActiveTab('Route');
            document.getElementById('panelTitle').innerText = "Gestión de Rutas";
            document.getElementById('panelContent').innerHTML = `
                <p class="mb-2">Planifica o gestiona tus rutas sin conexión:</p>
                <div class="space-y-2">
                    <button onclick="if(destinationMarker){ map.setView(destinationMarker.getLatLng(), 16); closePanel(); } else { alert('Primero establece un destino por voz'); }" class="w-full py-2 bg-blue-600 rounded-xl text-white font-semibold active:scale-95 transition">Ver Destino Actual</button>
                </div>
            `;
            document.getElementById('actionPanel').classList.remove('hidden');
        }

        function openVoiceMenu() {
            setActiveTab('Voice');
            document.getElementById('panelTitle').innerText = "Asistente de Voz GPS";
            document.getElementById('panelContent').innerHTML = `
                <p id="voiceStatus" class="mb-3 text-emerald-400 font-medium">Toca el botón para hablar y di tu destino.</p>
                <button onclick="startListening()" class="w-full py-3 bg-emerald-600 rounded-xl text-white font-bold text-sm shadow-lg active:scale-95 transition flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    <span>Hablar al Asistente</span>
                </button>
            `;
            document.getElementById('actionPanel').classList.remove('hidden');
        }

        function openMenu() {
            setActiveTab('Menu');
            document.getElementById('panelTitle').innerText = "Menú y Opciones";
            document.getElementById('panelContent').innerHTML = `
                <p class="mb-2">Navegador GPS Offline con síntesis y reconocimiento de voz.</p>
                <button onclick="location.reload()" class="w-full py-2 bg-slate-800 border border-slate-600 rounded-xl text-slate-200 active:scale-95 transition">Reiniciar App</button>
            `;
            document.getElementById('actionPanel').classList.remove('hidden');
        }

        function closePanel() {
            document.getElementById('actionPanel').classList.add('hidden');
            setActiveTab('Map');
        }

        function setActiveTab(tab) {
            ['Map', 'Route', 'Voice', 'Menu'].forEach(t => {
                const el = document.getElementById('tab' + t);
                if(el) el.className = "flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200";
            });
            const active = document.getElementById('tab' + tab);
            if(active) active.className = "flex flex-col items-center space-y-1 text-blue-500";
        }

        window.onload = initMap;
    </script>
</body>
</html>
