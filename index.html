<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OfflineNav Android GPS & Voz</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>
<body class="text-slate-100 bg-slate-900">

    <!-- Barra Superior -->
    <header style="position: fixed; top: 0; left: 0; right: 0; z-index: 1000;" class="p-3 flex items-center justify-between bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-lg">
        <div class="flex items-center space-x-2">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-md">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-tight text-white leading-tight">OfflineNav Android</h1>
                <div class="flex items-center space-x-1.5 text-xs text-emerald-400">
                    <span id="gpsStatusDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="gpsStatusText">Buscando GPS...</span>
                    <span class="text-slate-500">•</span>
                    <span id="speedDisplay">0 km/h</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <!-- Script de Inicialización -->
    <script>
        let map, userMarker;

        function initMap() {
            // Coordenadas iniciales (CDMX / México por defecto)
            map = L.map('map', { zoomControl: false }).setView([19.4326, -99.1332], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap',
                subdomains: ['a', 'b', 'c']
            }).addTo(map);

            // Forzar recálculo del tamaño del mapa tras cargar
            setTimeout(() => {
                map.invalidateSize();
            }, 500);

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(0) : 0;

                        document.getElementById('speedDisplay').innerText = `${speed} km/h`;
                        document.getElementById('gpsStatusText').innerText = "GPS Activo";

                        const latLng = [lat, lng];
                        if (!userMarker) {
                            userMarker = L.marker(latLng).addTo(map);
                            map.setView(latLng, 16);
                        } else {
                            userMarker.setLatLng(latLng);
                        }
                    },
                    (error) => {
                        document.getElementById('gpsStatusText').innerText = "Ubicación predeterminada";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
